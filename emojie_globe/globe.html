      const search = (typeof window !== 'undefined' && window.location && typeof window.location.search === 'string')

      function emojiToCodePoint(emoji){
        var codePoints = [];
        var i = 0;
        while(i < emoji.length){
          var code = emoji.codePointAt(i);
          if(code !== 0xfe0f && code !== 0xfe0e){
            codePoints.push(code.toString(16));
          }
          i += code > 0xffff ? 2 : 1;
        }
        return codePoints.join('-');
      }

      function ensureEmojiImage(emoji){
        var cache = emojiImageCache[emoji];
        if(cache){
          return cache.promise;
        }
        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.decoding = 'async';
        var code = emojiToCodePoint(emoji);
        cache = { image: img, ready: false, failed: false, promise: null };
        cache.promise = new Promise(function(resolve){
          img.onload = function(){ cache.ready = true; resolve(img); };
          img.onerror = function(){ cache.failed = true; resolve(null); };
        });
        emojiImageCache[emoji] = cache;
        img.src = TWEMOJI_BASE_URL + code + '.png';
        return cache.promise;
      }

      function getEmojiImage(emoji){
        var cache = emojiImageCache[emoji];
        if(cache && cache.ready && cache.image){

        }
        return null;

      function preloadEmojiImages(emojis, progressCallback){
        var unique = [];
        var seen = Object.create(null);
        for(var i=0;i<emojis.length;i++){
          var key = emojis[i];
          if(!seen[key]){
            seen[key] = true;
            unique.push(key);
          }

        if(!unique.length){
          return Promise.resolve();
        }
        var completed = 0;
        return Promise.all(unique.map(function(emoji){
          return ensureEmojiImage(emoji).then(function(){
            completed += 1;
            if(progressCallback){
              progressCallback(completed, unique.length);
            }
          });
        }));

        var pts = [];
        var golden = Math.PI * (3 - Math.sqrt(5));
        var denom = Math.max(1, n - 1);
        for(var i=0;i<n;i++){
          var y = 1 - (i / denom) * 2;
          var radiusXZ = Math.sqrt(Math.max(0, 1 - y * y));
          var theta = i * golden;
          var x = Math.cos(theta) * radiusXZ;
          var z = Math.sin(theta) * radiusXZ;
          pts.push({ x: x, y: y, z: z });
        }
        return pts;

  var DEFAULT_COUNT_MOBILE = 600;
  var isNarrowScreen = Math.min(window.innerWidth, window.innerHeight) <= 768;
  var EMOJI_COUNT = isNarrowScreen ? DEFAULT_COUNT_MOBILE : DEFAULT_COUNT_DESKTOP;
        if(countInput){
          var parsed = parseInt(countInput.value, 10);
          var hasCustomValue = !isNaN(parsed) && parsed !== DEFAULT_COUNT_DESKTOP && parsed !== DEFAULT_COUNT_MOBILE;
          if(hasCustomValue){
            EMOJI_COUNT = parsed;
          }
          countInput.value = EMOJI_COUNT;
        }
  if(countLabel){ countLabel.textContent = EMOJI_COUNT; }

  var width = 0;
        var height = 0;
        var radius = 0;
        var DPR = Math.min(window.devicePixelRatio || 1, 2);

        function resize(){
          width = container.clientWidth || window.innerWidth;
          height = container.clientHeight || window.innerHeight;
          radius = Math.min(width, height) * 0.36;
          canvas.width = Math.floor(width * DPR);
          canvas.height = Math.floor(height * DPR);
          canvas.style.width = width + 'px';
          canvas.style.height = height + 'px';
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        }
        resize();
        window.addEventListener('resize', resize);

        function supportsNativeFullscreen(){
          if(!container) return false;
          return !!(container.requestFullscreen || container.webkitRequestFullscreen || container.msRequestFullscreen);
        }

        function applyPseudoFullscreen(enabled){
          pseudoFullscreen = enabled;
          var body = document.body;
          if(body){
            body.classList.toggle('pseudo-fullscreen', enabled);
          }
          container.classList.toggle('pseudo-fullscreen', enabled);
          if(fullscreenBtn){
            fullscreenBtn.classList.toggle('pseudo-active', enabled);
          }
        }

        function enablePseudoFullscreen(){
          if(pseudoFullscreen) return;
          applyPseudoFullscreen(true);
          updateFullscreenState();
          resize();
        }

        function disablePseudoFullscreen(){
          if(!pseudoFullscreen) return;
          applyPseudoFullscreen(false);
          updateFullscreenState();
          resize();
        }

        function fullscreenElement(){
          return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
        }

        function isFullscreenActive(){
          return pseudoFullscreen || fullscreenElement() === container;
        }

        function handleFullscreenError(err){
          console.warn('Fullscreen error', err);
          setStatus('Fullscreen not supported here. Using expanded view.', false, { autoHide: false });
          enablePseudoFullscreen();
          setTimeout(function(){ setStatus('Ready'); }, 1500);
        }

        function updateFullscreenState(){
          var nativeActive = fullscreenElement() === container;
          var active = nativeActive || pseudoFullscreen;
          if(fullscreenBtn){
            fullscreenBtn.classList.toggle('active', nativeActive && !pseudoFullscreen);
            fullscreenBtn.setAttribute('aria-pressed', active ? 'true' : 'false');
            fullscreenBtn.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
            fullscreenBtn.textContent = active ? '⤡' : '⤢';
          }
          if(fullscreenBack){
            fullscreenBack.classList.toggle('visible', active);
            fullscreenBack.setAttribute('aria-hidden', active ? 'false' : 'true');
          }
          if(statusEl && active){
            hideStatusAfter(0);
          }
        }

        function enterFullscreen(){
          if(!container) return;
          if(pseudoFullscreen){
            updateFullscreenState();
            return;
          }
          if(supportsNativeFullscreen()){
            try{
              var req = null;
              if(container.requestFullscreen){ req = container.requestFullscreen(); }
              else if(container.webkitRequestFullscreen){ req = container.webkitRequestFullscreen(); }
              else if(container.msRequestFullscreen){ req = container.msRequestFullscreen(); }
              if(req && req.catch){
                req.catch(function(err){ handleFullscreenError(err); });
              }
              if(fullscreenFallbackTimer){ clearTimeout(fullscreenFallbackTimer); }
              fullscreenFallbackTimer = setTimeout(function(){
                fullscreenFallbackTimer = null;
                if(!isFullscreenActive()){
                  handleFullscreenError(new Error('Native fullscreen request timed out'));
                }
              }, 450);
            }catch(err){
              handleFullscreenError(err);
            }
          } else {
            setStatus('Expanded view enabled.', false, { delay: 1600 });
            enablePseudoFullscreen();
            setTimeout(function(){ setStatus('Ready'); }, 1400);
          }
        }

        function exitFullscreen(){
          if(fullscreenFallbackTimer){
            clearTimeout(fullscreenFallbackTimer);
            fullscreenFallbackTimer = null;
          }
          if(pseudoFullscreen){
            disablePseudoFullscreen();
            return;
          }
          try{
            var exit = null;
            if(document.exitFullscreen){ exit = document.exitFullscreen(); }
            else if(document.webkitExitFullscreen){ document.webkitExitFullscreen(); }
            else if(document.msExitFullscreen){ document.msExitFullscreen(); }
            if(exit && exit.catch){ exit.catch(handleFullscreenError); }
          }catch(err){ handleFullscreenError(err); }
        }

        function onFullscreenChange(){
          if(fullscreenFallbackTimer){
            clearTimeout(fullscreenFallbackTimer);
            fullscreenFallbackTimer = null;
          }
          updateFullscreenState();
          resize();
        }

        if(fullscreenBtn && !fullscreenBtn.dataset.bound){
          fullscreenBtn.addEventListener('click', function(){
            if(isFullscreenActive()){
              exitFullscreen();
            } else {
              enterFullscreen();
            }
          });
          fullscreenBtn.dataset.bound = '1';
        }
        if(fullscreenBack && !fullscreenBack.dataset.bound){
          fullscreenBack.addEventListener('click', function(){
            if(pseudoFullscreen){
              disablePseudoFullscreen();
            } else if(isFullscreenActive()){
              exitFullscreen();
            }
          });
          fullscreenBack.dataset.bound = '1';
        }
        document.addEventListener('keydown', function(e){
          if(e && (e.key === 'Escape' || e.key === 'Esc') && pseudoFullscreen){
            e.preventDefault();
            disablePseudoFullscreen();
          }
        });
        document.addEventListener('fullscreenchange', onFullscreenChange);
        document.addEventListener('webkitfullscreenchange', onFullscreenChange);
        document.addEventListener('msfullscreenchange', onFullscreenChange);
        document.addEventListener('fullscreenerror', handleFullscreenError);
        document.addEventListener('webkitfullscreenerror', handleFullscreenError);

        var points = [];
        function rebuild(n){
          var base = fibonacciPoints(n);
          var pool = EMOJI_POOL.length ? EMOJI_POOL : (selectedCats.length ? buildEmojiPool(allCategoryKeys) : []);
          if(!pool.length){
            points = [];
            return;
          }
          points = [];
          for(var i=0;i<base.length;i++){
            var emoji = pool[i % pool.length];
            points.push({ x: base[i].x, y: base[i].y, z: base[i].z, emoji: emoji });
            ensureEmojiImage(emoji);
          }
        }
        rebuild(EMOJI_COUNT);

        if(countInput && !countInput.dataset.boundDensity){
          var rebuildFrame = null;
          countInput.addEventListener('input', function(e){
            var v = parseInt(e.target.value, 10);
            if(isNaN(v)) return;
            if(countLabel){ countLabel.textContent = v; }
            if(rebuildFrame){ cancelAnimationFrame(rebuildFrame); }
            rebuildFrame = requestAnimationFrame(function(){
              EMOJI_COUNT = v;
              rebuild(EMOJI_COUNT);
            });
          });
          countInput.dataset.boundDensity = '1';
        }

  var rotY = 0;
  var rotX = 0;
  var auto = 0.06;
  var dragging = false;
  var lastX = 0;
  var lastY = 0;
  var activePointers = Object.create(null);
  var pinchStartDistance = null;
  var pinchStartRadius = null;

        function trySetPointerCapture(target, pointerId){
          try{
            if(target.setPointerCapture){
              target.setPointerCapture(pointerId);
            }
          }catch(_err){}
        }

        function tryReleasePointerCapture(target, pointerId){
          try{
            if(target.releasePointerCapture){
              target.releasePointerCapture(pointerId);
            }
          }catch(_err){}
        }

        function activePointerIds(){
          return Object.keys(activePointers);
        }

        function updatePointer(e){
          activePointers[e.pointerId] = { x: e.clientX, y: e.clientY };
        }

        function removePointer(e){
          delete activePointers[e.pointerId];
          if(activePointerIds().length < 2){
            pinchStartDistance = null;
            pinchStartRadius = null;
          }
        }

        function computeDistance(a, b){
          if(!a || !b) return 0;
          var dx = a.x - b.x;
          var dy = a.y - b.y;
          return Math.sqrt(dx * dx + dy * dy);
        }

        function clampRadius(value){
          var minRadius = 60;
          var maxRadius = Math.min(width, height) * 0.48;
          if(value < minRadius) value = minRadius;
          if(value > maxRadius) value = maxRadius;
          return value;
        }

        canvas.addEventListener('pointerdown', function(e){
          e.preventDefault();
          updatePointer(e);
          var ids = activePointerIds();
          if(ids.length === 1){
            dragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
            canvas.style.cursor = 'grabbing';
          } else if(ids.length === 2){
            dragging = false;
            var first = activePointers[ids[0]];
            var second = activePointers[ids[1]];
            pinchStartDistance = computeDistance(first, second) || null;
            pinchStartRadius = radius;
          }
          trySetPointerCapture(canvas, e.pointerId);
        });

        canvas.addEventListener('pointerup', function(e){
          dragging = false;
          canvas.style.cursor = 'grab';
          removePointer(e);
          tryReleasePointerCapture(canvas, e.pointerId);
        });

        canvas.addEventListener('pointercancel', function(e){
          dragging = false;
          canvas.style.cursor = 'grab';
          removePointer(e);
          tryReleasePointerCapture(canvas, e.pointerId);
        });

        canvas.addEventListener('pointerleave', function(e){
          dragging = false;
          canvas.style.cursor = 'grab';
          if(e){
            removePointer(e);
          }
        });

        canvas.addEventListener('pointermove', function(e){
          e.preventDefault();
          if(activePointers[e.pointerId]){
            updatePointer(e);
          }
          var ids = activePointerIds();
          if(ids.length >= 2){
            var first = activePointers[ids[0]];
            var second = activePointers[ids[1]];
            if(!pinchStartDistance || !pinchStartRadius){
              pinchStartDistance = computeDistance(first, second) || null;
              pinchStartRadius = radius;
            }
            var currentDistance = computeDistance(first, second);
            if(currentDistance && pinchStartRadius && pinchStartDistance){
              var scale = currentDistance / pinchStartDistance;
              if(scale){
                radius = clampRadius(pinchStartRadius * scale);
                pinchStartRadius = radius;
                pinchStartDistance = currentDistance;
              }
            }
            return;
          }
          if(!dragging) return;
          var dx = e.clientX - lastX;
          var dy = e.clientY - lastY;
          lastX = e.clientX;
          lastY = e.clientY;
          rotY += dx * 0.01;
          rotX += dy * 0.01;
          var limit = Math.PI / 2 - 0.05;
          if(rotX > limit) rotX = limit;
          if(rotX < -limit) rotX = -limit;
        });

        canvas.addEventListener('wheel', function(e){
          e.preventDefault();
          var delta = e.deltaY > 0 ? 1 : -1;
          var nextRadius = radius * (delta > 0 ? 0.93 : 1.07);
          radius = clampRadius(nextRadius);
        }, { passive: false });

        var lastDraw = [];

        function draw(){
          ctx.clearRect(0,0,width,height);
          ctx.beginPath();
          ctx.arc(width/2, height/2, radius, 0, Math.PI*2);
          ctx.strokeStyle = 'rgba(255,255,255,0.08)';
          ctx.lineWidth = 1;
          ctx.stroke();

          var t = performance.now() * 0.001;
          var angleY = rotY + t * auto;
          var sinY = Math.sin(angleY);
          var cosY = Math.cos(angleY);
          var sinX = Math.sin(rotX);
          var cosX = Math.cos(rotX);

          var projected = [];
          for(var i=0;i<points.length;i++){
            var p = points[i];
            var x1 = p.x * cosY + p.z * sinY;
            var y1 = p.y;
            var z1 = -p.x * sinY + p.z * cosY;
            var x = x1;
            var y = y1 * cosX - z1 * sinX;
            var z = y1 * sinX + z1 * cosX;
            if(z <= -0.05) continue;
            var depth = (z + 1) / 2;
            var s = 0.5 + depth * 0.7;
            projected.push({
              px: width/2 + x * radius,
              py: height/2 - y * radius,
              s: s,
              z: z,
              emoji: p.emoji
            });
          }
          projected.sort(function(a,b){ return a.z - b.z; });

          lastDraw = [];
          for(var i=0;i<projected.length;i++){
            var q = projected[i];
            var size = Math.max(16, Math.floor(22 * q.s));
            var half = size / 2;
            var clickRadius = size * 0.55;
            var img = getEmojiImage(q.emoji);
            if(img){
              ctx.globalAlpha = 1;
              ctx.drawImage(img, q.px - half, q.py - half, size, size);
            } else {
              ctx.globalAlpha = 0.7;
              ctx.fillStyle = '#4f4f4f';
              ctx.beginPath();
              ctx.arc(q.px, q.py, Math.max(6, clickRadius * 0.6), 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.globalAlpha = 1;
            lastDraw.push({ x: q.px, y: q.py, r: clickRadius, emoji: q.emoji });
          }

          requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);

        canvas.addEventListener('click', function(e){
          var rect = canvas.getBoundingClientRect();
          var x = e.clientX - rect.left;
          var y = e.clientY - rect.top;
          for(var i=lastDraw.length-1;i>=0;i--){
            var item = lastDraw[i];
            var dx = x - item.x;
            var dy = y - item.y;
            if(dx*dx + dy*dy <= item.r * item.r){
              copyEmoji(item.emoji);
              break;
            }
          }
        });

        function copyEmoji(emoji){
          function success(){
            setStatus('Copied ' + emoji + ' to clipboard');
            setTimeout(function(){ setStatus('Ready'); }, 1200);
          }
          function failure(){
            setStatus('Copy failed. Please copy manually.', true);
            setTimeout(function(){ setStatus('Ready'); }, 1500);
          }
          if(navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(emoji).then(success).catch(function(){
              if(manualCopy(emoji)){ success(); } else { failure(); }
            });
          } else {
            if(manualCopy(emoji)){ success(); } else { failure(); }
          }
        }

  updateFullscreenState();
  syncCategoriesFromInputs();
      }

      initCanvasGlobe();
    })();
  </script>
</body>
</html>
