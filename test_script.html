1235:        for (let i = toRemove.length - 1; i >= 0; i--) obstacles.splice(toRemove[i], 1);
1236:      }
1237:
1238:      // ─── Update Powerups ───────────────────────────────────────
1239:      function updatePowerups(dt) {
1240:        const rh = ROAD_H();
1241:        const speed = obstacleSpeed * (nitroActive ? 1.8 : 1) * .8;
1242:        const toRemove = [];
1243:
1244:        for (let i = 0; i < powerups.length; i++) {
1245:          const p = powerups[i];
1246:          p.y += speed * dt;
1247:          p.el.style.top = p.y + 'px';
1248:
1249:          if (p.y > rh + 60) {
1250:            p.el.remove();
1251:            toRemove.push(i);
1252:            continue;
1253:          }
1254:
1255:          // Collision with player
1256:          if (aabb(playerX, playerY, PLAYER_W, PLAYER_H, p.x, p.y, POWERUP_SIZE, POWERUP_SIZE)) {
1257:            collectPowerup(p);
1258:            p.el.remove();
1259:            toRemove.push(i);
1260:          }
1261:        }
1262:
1263:        for (let i = toRemove.length - 1; i >= 0; i--) powerups.splice(toRemove[i], 1);
1264:      }

1266:      function collectPowerup(p) {
1267:        sfxPowerup();
1268:        switch (p.type) {
1269:          case 'fuel':
1270:            fuel = Math.min(100, fuel + 30);
1271:            break;
1272:          case 'shield':
1273:            shieldActive = true;
1274:            shieldTimeLeft = 8;
1275:            shieldTimerChip.style.display = '';
1276:            break;
1277:          case 'nitro':
1278:            nitro = Math.min(100, nitro + 40);
1279:            break;
1280:        }
1281:      }

1286:        fuel -= drain * dt;
1287:        fuel = Math.max(0, fuel);
1288:        fuelBarInner.style.width = fuel + '%';
1289:
1290:        if (fuel <= 0) {
1291:          endGame(null, true);
1292:        }
1293:      }

1295:      // ─── Nitro System ─────────────────────────────────────────
1296:      function updateNitro(dt) {
1297:        nitroBarInner.style.width = nitro + '%';
1298:        if (nitroActive) {
1299:          nitro -= 25 * dt; // drains over ~4s
1300:          if (nitro <= 0) {
1301:            nitro = 0;
1302:            nitroActive = false;
1303:          }
1304:        }
1305:      }

1307:      // ─── Shield Timer ─────────────────────────────────────────
1308:      function updateShield(dt) {
1309:        if (shieldActive) {
1310:          shieldTimeLeft -= dt;
1311:          shieldCountdown.textContent = Math.ceil(shieldTimeLeft);
1312:          if (shieldTimeLeft <= 0) {

1317:        }
1318:      }

1320:      // ─── Scoring & Difficulty ─────────────────────────────────
1321:      function updateScoring(dt) {
1322:        scoreAccum += dt;
1323:        // 1 point per 0.1 seconds survived
1324:        const pts = Math.floor(scoreAccum * 10);
1325:        if (pts > 0) {
1326:          score += pts;
1327:          scoreAccum -= pts / 10;
1328:        }
1329:        scoreDisplay.textContent = score;
1330:
1331:        // Difficulty bumps every 12 seconds
1332:        gameTime += dt;
1333:        if (gameTime - lastDifficultyBump >= 12) {
1334:          lastDifficultyBump = gameTime;
1335:          speedLevel++;
1336:          baseSpeed += 20;
1337:          obstacleSpeed = baseSpeed;
1338:          spawnInterval = Math.max(350, 1100 - speedLevel * 80);
1339:          speedDisplay.textContent = speedLevel;
1340:
1341:          // Add lanes at certain levels
1342:          if (speedLevel === 4 && lanes < 4) {
1343:            lanes = 4;
1344:            createLaneLines();
1345:          } else if (speedLevel === 7 && lanes < 5) {
1346:            lanes = 5;
1347:            createLaneLines();
1348:          }
1349:        }
1350:      }

1352:      // ─── End Game ──────────────────────────────────────────────
1353:      function endGame(hitObs, outOfFuel) {
1354:        state = 'gameover';
1355:        sfxCrash();

1357:        if (hitObs) {
1358:          showCrash(playerX + PLAYER_W / 2, playerY + PLAYER_H / 2);
1359:          playerEl.style.filter = 'grayscale(1) brightness(.5)';
1360:        }
1361:
1362:        if (score > highScore) {

1364:          localStorage.setItem('emojiRacing_highScore', highScore);
1365:          highScoreDisplay.textContent = highScore;
1366:        }
1367:
1368:        finalScoreEl.textContent = score;
1369:        gameOverHighScoreEl.textContent = highScore;
1370:        gameOverMsg.textContent = outOfFuel ? '⛽ Out of fuel!' : '💥 You crashed!';
1371:
1372:        setTimeout(() => {
1373:          gameOverScreen.style.display = 'flex';
1374:        }, outOfFuel ? 200 : 600);
1375:      }

1377:      // ─── Main Game Loop ────────────────────────────────────────
1378:      function gameLoop(timestamp) {
1379:        if (state !== 'playing') { requestAnimationFrame(gameLoop); return; }
1380:
1381:        if (!lastFrameTime) lastFrameTime = timestamp;
1382:        let dt = (timestamp - lastFrameTime) / 1000;
1383:        lastFrameTime = timestamp;
1384:
1385:        // Clamp dt to avoid huge jumps (e.g., tab was inactive)
1386:        if (dt > .1) dt = .016;
1387:
1388:        // Spawn obstacles
1389:        timeSinceSpawn += dt * 1000;
1390:        if (timeSinceSpawn >= spawnInterval) {
1391:          spawnObstacle();
1392:          timeSinceSpawn = 0;
1393:        }
1394:
1395:        // Spawn powerups
1396:        timeSincePowerup += dt * 1000;
1397:        if (timeSincePowerup >= powerupInterval) {
1398:          spawnPowerup();
1399:          timeSincePowerup = 0;
1400:        }
1401:
1402:        updatePlayer(dt);
1403:        updateObstacles(dt);
1404:        updatePowerups(dt);
1405:        updateLaneLines(dt);
1406:        updateSpeedLines(dt);
1407:        updateFuel(dt);
1408:        updateNitro(dt);
1409:        updateShield(dt);
1410:        updateScoring(dt);
1411:
1412:        requestAnimationFrame(gameLoop);
1413:      }
